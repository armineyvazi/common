version: "2"

linters:
  default: none
  enable:
    - errcheck
    - govet
    - staticcheck
    - gocyclo
    - unparam
    - ineffassign
    - unused
    - bodyclose
    - noctx
    - gocritic
    - misspell

settings:
  gocyclo:
    min-complexity: 15
  gocritic:
    disabled-checks:
      - appendAssign
  errcheck:
    check-type-assertions: false
    check-blank: false

issues:
  exclusions:
    rules:
      # Test helpers: relax errcheck, unparam, and noctx in _test.go files.
      - path: ".*_test\\.go$"
        linters:
          - errcheck
          - unparam
          - noctx

      # The ports.AppError interface defines Is(ErrorType) as a domain method,
      # not the stdlib errors.Is sentinel. Renaming it breaks the public API.
      - linters:
          - govet
        text: "method Is\\("

      # QF1008: "could remove embedded field from selector" — pre-existing
      # style; safe to suppress until a refactor pass.
      - linters:
          - staticcheck
        text: "QF1008"

      # ST1018: Persian string literals with Unicode invisible characters are
      # intentional (zero-width non-joiner in Farsi typography).
      - linters:
          - staticcheck
        text: "ST1018"
