name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: testdb
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h localhost"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: testdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      rabbitmq:
        image: rabbitmq:3-management-alpine
        ports:
          - 5672:5672
        options: >-
          --health-cmd "rabbitmqctl node_health_check"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install C build tools
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends gcc libc6-dev

      - name: Download dependencies
        run: go mod download
        env:
          CGO_ENABLED: "1"

      - name: Verify dependencies
        run: go mod verify

      - name: Check formatting
        run: |
          if [ "$(gofmt -l . | wc -l)" -gt 0 ]; then
            echo "The following files are not formatted:"
            gofmt -l .
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: Unit tests
        run: go test -count=1 -timeout 60s ./...
        env:
          CGO_ENABLED: "1"

      - name: Race detector
        run: go test -race -count=1 -timeout 120s ./...
        env:
          CGO_ENABLED: "1"

      - name: Coverage
        run: go test -cover -coverprofile=coverage.out ./...
        env:
          CGO_ENABLED: "1"

      - name: Build
        run: go build ./...
        env:
          CGO_ENABLED: "1"

      - name: Integration tests
        run: |
          go test -tags integration -count=1 -timeout 120s ./...
        env:
          CGO_ENABLED: "1"
          REDIS_ADDR: localhost:6379
          MYSQL_DSN: root:root@tcp(localhost:3306)/testdb?parseTime=True&loc=Local
          POSTGRES_DSN: host=localhost user=postgres password=postgres dbname=testdb port=5432 sslmode=disable
          RABBITMQ_DSN: amqp://guest:guest@localhost:5672/

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install golangci-lint
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.13.2

      - name: Run golangci-lint
        run: golangci-lint run --timeout=5m
