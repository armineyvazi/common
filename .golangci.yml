version: "2"

linters:
  default: none
  enable:
    - errcheck
    - govet
    - staticcheck
    - gocyclo
    - unparam
    - gosimple
    - ineffassign
    - unused
    - bodyclose
    - noctx
    - gocritic
    - misspell
    - revive

linters-settings:
  gocyclo:
    min-complexity: 15
  gocritic:
    disabled-checks:
      - appendAssign
  revive:
    rules:
      - name: exported
        severity: warning
  errcheck:
    check-type-assertions: false
    check-blank: false

issues:
  exclude-rules:
    - path: "_test\\.go"
      linters:
        - errcheck
        - unparam
